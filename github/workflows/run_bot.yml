name: Monitor Immobiliare

on:
  schedule:
    # Esegue il controllo ogni 6 ore in automatico
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ti permette anche di avviarlo manualmente quando vuoi con un click

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: |
          python bot.py
